[project]
name = "markets-briefing"
version = "0.2.0"
description = "Morning markets briefing pipeline: podcast transcripts, prediction market monitoring, and synthesis."
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "httpx>=0.27",
    "assemblyai>=0.30",
    "openai>=1.0",
    "anthropic>=0.25",
    "python-dotenv>=1.0",
]

[project.scripts]
podcast-processor = "podcast_processor.pipeline:main"
polymarket-monitor = "run_polymarket:main"
