[project]
name = "podcast-processor"
version = "0.1.0"
description = "Automatically process podcast episodes from RSS feeds into structured, speaker-attributed transcripts and summaries."
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "assemblyai>=0.30",
    "openai>=1.0",
    "anthropic>=0.25",
    "python-dotenv>=1.0",
]

[project.scripts]
podcast-processor = "podcast_processor.pipeline:main"
